openapi: 3.1.0
info:
  # Do not change the title; generated import paths depend on it.
  title: Api
  version: 1.0.0
  description: API for soumyaraikwar.co.in — contact form (Gmail/Resend) and cached GitHub data.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: contact
  - name: github
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contact:
    post:
      operationId: sendMessage
      tags: [contact]
      summary: Send a contact message (stored, then emailed via Gmail SMTP or Resend)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSentResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSentResponse"
        "429":
          description: Too many messages from this address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageSentResponse"

  /github/prs:
    get:
      operationId: listMergedPrs
      tags: [github]
      summary: Pull requests (merged and open) authored by the site owner in other people's repos, cached for an hour
      responses:
        "200":
          description: PRs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergedPrList"

  /github/contributions:
    get:
      operationId: getContributionCalendar
      tags: [github]
      summary: Contribution calendar for the last year. Empty with configured=false when the server has no GITHUB_TOKEN.
      responses:
        "200":
          description: Calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionCalendar"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SendMessageBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 200
        subject:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 5000
        website:
          type: string
          description: Honeypot. Must be empty; bots that fill it are silently dropped.
          maxLength: 200
      required: [name, email, subject, body]

    MessageSentResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    MergedPr:
      type: object
      properties:
        repo:
          type: string
          description: owner/name
        number:
          type: integer
        title:
          type: string
        url:
          type: string
        state:
          type: string
          enum: [merged, open]
        createdAt:
          type: string
          format: date-time
        mergedAt:
          type: string
          format: date-time
          nullable: true
        durationHours:
          type: number
          description: Hours between opening and merge (or until now for open PRs)
      required: [repo, number, title, url, state, createdAt, mergedAt, durationHours]

    MergedPrList:
      type: object
      properties:
        prs:
          type: array
          items:
            $ref: "#/components/schemas/MergedPr"
        total:
          type: integer
        fetchedAt:
          type: string
          format: date-time
        stale:
          type: boolean
          description: True when GitHub was unreachable and a previous result is being served
      required: [prs, total, fetchedAt, stale]

    ContributionDay:
      type: object
      properties:
        date:
          type: string
        count:
          type: integer
        level:
          type: integer
          description: 0–4, GitHub's own intensity bucket
      required: [date, count, level]

    ContributionCalendar:
      type: object
      properties:
        configured:
          type: boolean
          description: False when the server has no GITHUB_TOKEN; weeks is then empty
        total:
          type: integer
        weeks:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/ContributionDay"
        fetchedAt:
          type: string
          format: date-time
      required: [configured, total, weeks, fetchedAt]
