name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build referenced TypeScript libs
        run: pnpm exec tsc -b lib/db lib/api-zod lib/api-client-react --force
      - name: Typecheck and build API
        run: |
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/api-server run build
      - name: Typecheck and build portfolio
        run: |
          pnpm --filter @workspace/portfolio run typecheck
          PORT=3000 BASE_PATH=/ pnpm --filter @workspace/portfolio run build
