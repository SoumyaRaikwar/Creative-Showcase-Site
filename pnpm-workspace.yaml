# Supply-chain guard: a package version must be at least 1 day old before pnpm
# will install it. Keep this on. Add exclusions only for urgent security fixes.
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  drizzle-orm: ^0.45.1
  react: 19.1.0
  react-dom: 19.1.0
  tailwindcss: ^4.1.14
  vite: ^7.3.0
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

overrides:
  # drizzle-kit pins an old esbuild through this loader; route it to tsx instead
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
